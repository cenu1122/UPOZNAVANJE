<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistent za Intervju - Web Pisala PRO</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .credits-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .credits-badge button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .credits-badge button:hover {
            background: #2563eb;
        }
        .control-bar {
            padding: 15px 25px;
            background: #f8fafc;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .control-bar label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .control-bar select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 13px;
        }
        .chat-box {
            height: 380px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.ai {
            background: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-left: 3px solid #3b82f6;
        }
        .message.user {
            background: #3b82f6;
            color: #ffffff;
            align-self: flex-end;
        }
        .input-area {
            padding: 15px 25px;
            background: #f8fafc;
            border-top: 1px solid #e1e4e8;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .input-area button {
            background: #0f172a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .input-area button:hover {
            background: #1e293b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>AI Asistent za Intervju</h2>
        <div class="credits-badge">
            <span>Krediti: <strong id="user-credits">1500</strong> znakova</span>
            <button onclick="topUpCredits()">Dopuni (PayPal)</button>
        </div>
    </div>

    <div class="control-bar">
        <label for="voice-type">Odabir glasa:</label>
        <select id="voice-type">
            <option value="browser">Standardni (Besplatno - Browser)</option>
            <option value="premium">Vrhunski (ElevenLabs - Naplata po znaku)</option>
        </select>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message ai">Pozdrav! Ja sam tvoj AI asistent za pripremu intervjua. Izaberi ulogu ili mi postavi pitanje pa da počnemo sa vježbom!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Napiši svoj odgovor ovdje..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Pošalji</button>
    </div>
</div>

<script>
    let userCredits = 1500; // Početni broj besplatnih karaktera na računu

    function updateCreditsDisplay() {
        document.getElementById('user-credits').innerText = userCredits;
    }

    function topUpCredits() {
        // Simulacija PayPal uplate i dopune kredita
        let amount = prompt("Unesi iznos karaktera za dopunu (npr. 10000):", "10000");
        if (amount && !isNaN(amount)) {
            userCredits += parseInt(amount);
            updateCreditsDisplay();
            alert("Uspješno dopunjeno! Dodato je " + amount + " karaktera na vaš račun.");
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const voiceType = document.getElementById('voice-type').value;
        const text = inputField.value.trim();

        if (!text) return;

        // Prikaz korisnikove poruke
        chatBox.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Provjera karaktera ako je odabran premium glas
        if (voiceType === 'premium') {
            const requiredCredits = text.length;
            if (userCredits < requiredCredits) {
                alert("Nemate dovoljno karaktera na računu za Premium glas! Dopunite kredit preko PayPal-a.");
                return;
            }
            userCredits -= requiredCredits;
            updateCreditsDisplay();
        }

        // Simulacija AI odgovora (ovdje se kasnije spaja na Groq API)
        setTimeout(() => {
            const aiReply = "Odlično zvuči! Možeš li mi preciznije objasniti kako rješavaš tehničke probleme pod pritiskom u radionici ili na projektu?";
            chatBox.innerHTML += `<div class="message ai">${escapeHtml(aiReply)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // Pokretanje glasa
            if (voiceType === 'browser') {
                playBrowserVoice(aiReply);
            } else {
                playElevenLabsVoice(aiReply);
            }
        }, 800);
    }

    function playBrowserVoice(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bs-BA'; // Podrazumevani jezik
            window.speechSynthesis.speak(utterance);
        } else {
            console.log("Browser Speech Synthesis nije podržan.");
        }
    }

    function playElevenLabsVoice(text) {
        console.log("Poziv ElevenLabs API-ju za tekst dužine:", text.length);
        // Ovdje ide fetch() prema tvom backend serveru koji komunicira sa ElevenLabs-om
    }

    function escapeHtml(unsafe) {
        return unsafe
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
