<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Firmu i Excel Upload | DocBizHub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            width: 600px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        p.opis {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .upload-box {
            border: 2px dashed #4f46e5;
            border-radius: 10px;
            padding: 30px;
            background-color: #252525;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #6366f1;
            background-color: #2a2a2a;
        }

        .upload-box img, .folder-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .btn-izaberi {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-izaberi:hover {
            background-color: #4338ca;
        }

        .btn-upload {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: none; /* Prikazuje se tek kada se izabere fajl */
        }

        .btn-upload:hover {
            background-color: #059669;
        }

        #file-name {
            color: #34d399;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        #status-poruka {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>🏢 Dodaj Firmu / Bulk Excel Upload</h2>
        <p class="opis">
            Izaberi ili prevuci svoj Excel (<code>.xlsx</code>) ili CSV fajl sa firmama i kontaktima. Sistem će automatski pročitati sve kolone i sinhronizovati ih direktno u Supabase tabelu <strong>POSAO:KOKORISNICI</strong>.
        </p>

        <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click();">
            📂
            <p style="margin: 10px 0 5px 0; font-weight: 500;">Klikni ovdje ili prevuci fajl</p>
            <span style="color: #71717a; font-size: 12px;">Podržani formati: .xlsx, .xls, .csv</span>
            <br>
            <button type="button" class="btn-izaberi" onclick="event.stopPropagation(); document.getElementById('file-input').click();">Izaberi fajl sa računara</button>
            
            <input type="file" id="file-input" accept=".xlsx, .xls, .csv" style="display: none;" onchange="fajlIzabran(this)">
        </div>

        <div id="file-name"></div>

        <button type="button" class="btn-upload" id="btn-submit" onclick="uploadUBazu()">Prebaci podatke u Supabase (POSAO:KOKORISNICI)</button>
        
        <div id="status-poruka"></div>
    </div>

    <script>
        // 1. OVDJE UNESI SVOJE SUPABASE PODATKE
        const SUPABASE_URL = 'TVOJ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TVOJ_SUPABASE_ANON_KEY';
        
        // Inicijalizacija Supabase klijenta (ako koristiš Supabase JS v2)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let izabraniPodaci = [];

        // Funkcija kada korisnik izabere fajl
        function fajlIzabran(input) {
            const fajl = input.files[0];
            if (!fajl) return;

            document.getElementById('file-name').innerText = `Izabrani fajl: ${fajl.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                // Uzimamo prvi sheet (list) iz Excel-a
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                // Pretvaramo podatke u JSON niz objekata (gdje su ključevi nazivi kolona iz Excel-a)
                izabraniPodaci = XLSX.utils.sheet_to_json(worksheet);

                if (izabraniPodaci.length > 0) {
                    document.getElementById('btn-submit').style.display = 'block';
                    document.getElementById('status-poruka').innerHTML = `<span style="color: #34d399;">Uspješno učitano ${izabraniPodaci redova iz fajla. Klikni dugme za slanje!</span>`;
                } else {
                    document.getElementById('status-poruka').innerHTML = `<span style="color: #ef4444;">Fajl je prazan ili pogrešno formatiran.</span>`;
                }
            };
            reader.readAsArrayBuffer(fajl);
        }

        // Funkcija koja klikom na dugme prebacuje podatke u Supabase tabelu
        async function uploadUBazu() {
            if (izabraniPodaci.length === 0) {
                alert('Nema podataka za slanje!');
                return;
            }

            const statusEl = document.getElementById('status-poruka');
            statusEl.innerHTML = '<span style="color: #f59e0b;">Slanje podataka u Supabase u toku...</span>';

            try {
                // Slanje u Supabase tabelu 'POSAO:KOKORISNICI' 
                // Napomena: Ako ti je naziv tabele u Supabase doslovno "POSAO:KOKORISNICI", unesi ga ispod:
                const { data, error } = await supabaseClient
                    .from('POSAO:KOKORISNICI') 
                    .insert(izabraniPodaci);

                if (error) {
                    throw error;
                }

                statusEl.innerHTML = '<span style="color: #10b981; font-weight: bold;">✅ Svi podaci su uspješno prebačeni u Supabase tabelu!</span>';
                document.getElementById('btn-submit').style.display = 'none';

            } catch (err) {
                console.error('Greška pri upisu:', err);
                statusEl.innerHTML = `<span style="color: #ef4444;">❌ Greška: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
