<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Firmu i Excel Upload | DocBizHub</title>
    <!-- Biblioteka za čitanje Excel/CSV fajlova (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Supabase JS klijent -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            width: 550px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        p.opis {
            color: #a0a0a0;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .upload-box {
            border: 2px dashed #4f46e5;
            border-radius: 10px;
            padding: 20px;
            background-color: #252525;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .upload-box:hover {
            border-color: #6366f1;
            background-color: #2a2a2a;
        }

        .btn-izaberi {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-upload {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background-color: #059669;
        }

        #file-name {
            color: #34d399;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 500;
        }

        #status-poruka {
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>🏢 Dodaj Firmu / Bulk Excel Upload</h2>
        <p class="opis">
            Izaberi svoj Excel (<code>.xlsx</code>) ili CSV fajl. Podaci će biti ubačeni u tabelu <strong>POSAO_KORISNICI</strong>.
        </p>

        <!-- Upload okvir -->
        <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click();">
            📂
            <p style="margin: 8px 0 5px 0; font-weight: 500; font-size: 14px;">Klikni ovdje ili prevuci fajl</p>
            <span style="color: #71717a; font-size: 11px;">Podržani formati: .xlsx, .xls, .csv</span>
            <br>
            <button type="button" class="btn-izaberi" onclick="event.stopPropagation(); document.getElementById('file-input').click();">Izaberi fajl sa računara</button>
            
            <input type="file" id="file-input" accept=".xlsx, .xls, .csv" style="display: none;" onchange="fajlIzabran(this)">
        </div>

        <div id="file-name"></div>

        <!-- STALNO VIDLJIVO ZELENO DUGME -->
        <button type="button" class="btn-upload" id="btn-submit" onclick="uploadUBazu()">🚀 Prebaci podatke u Supabase bazu</button>
        
        <div id="status-poruka"></div>
    </div>

    <script>
        // Uneseni tvoji pravi Supabase podaci
        const SUPABASE_URL = 'https://uduwpvdjmanrgpumdrfh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let izabraniPodaci = [];

        function fajlIzabran(input) {
            const fajl = input.files[0];
            if (!fajl) return;

            document.getElementById('file-name').innerText = `Izabrani fajl: ${fajl.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                izabraniPodaci = XLSX.utils.sheet_to_json(worksheet);

                if (izabraniPodaci.length > 0) {
                    document.getElementById('status-poruka').innerHTML = `<span style="color: #34d399;">Uspješno pročitano ${izabraniPodaci.length} redova. Klikni zeleno dugme!</span>`;
                } else {
                    document.getElementById('status-poruka').innerHTML = `<span style="color: #ef4444;">Fajl je prazan.</span>`;
                }
            };
            reader.readAsArrayBuffer(fajl);
        }

        async function uploadUBazu() {
            if (izabraniPodaci.length === 0) {
                alert('Prvo izaberi Excel ili CSV fajl!');
                return;
            }

            const statusEl = document.getElementById('status-poruka');
            statusEl.innerHTML = '<span style="color: #f59e0b;">Slanje u Supabase u toku...</span>';

            try {
                // Upis u tabelu POSAO_KORISNICI
                const { data, error } = await supabaseClient
                    .from('POSAO_KORISNICI') 
                    .insert(izabraniPodaci);

                if (error) throw error;

                statusEl.innerHTML = '<span style="color: #10b981; font-weight: bold;">✅ Podaci uspješno prebačeni u bazu!</span>';
                izabraniPodaci = [];
                document.getElementById('file-name').innerText = '';

            } catch (err) {
                console.error('Greška:', err);
                statusEl.innerHTML = `<span style="color: #ef4444;">❌ Greška: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
