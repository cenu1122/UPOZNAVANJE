<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poruke | LjubavNaPrviKlik</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: #fff0f3; 
      color: #2b2d42; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }

    header { 
      background-color: #2b2d42; 
      color: #fff; 
      padding: 12px 5%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-shrink: 0; 
    }
    
    .logo { 
      font-size: 1.2rem; 
      font-weight: bold; 
      color: #fff; 
      text-decoration: none; 
    }
    
    .btn-nav { 
      background: #d90429; 
      color: #fff; 
      text-decoration: none; 
      padding: 6px 12px; 
      border-radius: 20px; 
      font-weight: bold; 
      font-size: 0.8rem; 
    }

    .chat-container { 
      flex: 1; 
      display: flex; 
      max-width: 1200px; 
      width: 100%; 
      margin: 0 auto; 
      background: #fff; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      overflow: hidden; 
    }

    .users-sidebar { 
      width: 320px; 
      background: #fdf0f2; 
      border-right: 1px solid #ffd8df; 
      display: flex; 
      flex-direction: column; 
      flex-shrink: 0; 
    }
    
    .sidebar-header { 
      padding: 12px 15px; 
      background: #2b2d42; 
      color: #fff; 
      font-weight: bold; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    .btn-refresh { 
      background: #ef233c; 
      color: #fff; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 12px; 
      font-size: 0.75rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s; 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    }
    
    .btn-refresh:hover { 
      background: #d90429; 
    }

    .user-list { 
      flex: 1; 
      overflow-y: auto; 
    } 
    
    .user-item { 
      padding: 10px 14px; 
      border-bottom: 1px solid #ffe3e8; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      cursor: pointer; 
    }
    
    .user-item:hover, 
    .user-item.active { 
      background: #ffe0e5; 
    }
    
    .user-avatar { 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background: #d90429; 
      color: #fff; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      flex-shrink: 0; 
    }
    
    .status-badge { 
      font-size: 0.7rem; 
      font-weight: bold; 
      padding: 2px 6px; 
      border-radius: 10px; 
      display: inline-block; 
    }
    
    .status-badge.online { 
      background: #28a745; 
      color: #fff; 
    }
    
    .status-badge.offline { 
      background: #ccc; 
      color: #444; 
    }

    .user-info { 
      flex: 1; 
      overflow: hidden; 
    }
    
    .user-info h4 { 
      font-size: 0.9rem; 
      margin-bottom: 2px; 
      display: flex; 
      justify-content: space-between; 
    }

    .chat-window { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background: #fff; 
      min-width: 0; 
    }
    
    .chat-header { 
      padding: 12px 20px; 
      border-bottom: 1px solid #eee; 
      background: #fafafa; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    }

    .ai-toolbar { 
      background: #f3e5f5; 
      border-bottom: 1px solid #e1bee7; 
      padding: 8px 15px; 
      font-size: 0.8rem; 
      color: #4a148c; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap;
      gap: 10px;
    }

    .ai-toolbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .messages-box { 
      flex: 1; 
      padding: 15px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: #fff8f9; 
    }
    
    .message { 
      max-width: 80%; 
      padding: 10px 14px; 
      border-radius: 12px; 
      font-size: 0.9rem; 
      word-wrap: break-word; 
      position: relative;
    }
    
    .message.sent { 
      align-self: flex-end; 
      background: #d90429; 
      color: #fff; 
    }
    
    .message.received { 
      align-self: flex-start; 
      background: #fff; 
      color: #2b2d42; 
      border: 1px solid #ddd; 
    }

    .translation-subtext {
      font-size: 0.8rem;
      font-style: italic;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px dashed rgba(255,255,255,0.4);
      display: none; /* Inicijalno sakriveno */
    }

    .message.received .translation-subtext {
      border-top-color: #ddd;
      color: #555;
    }

    .btn-toggle-orig {
      background: rgba(0, 0, 0, 0.2);
      border: none;
      color: inherit;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
      font-weight: bold;
    }

    .message.sent .btn-toggle-orig {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .btn-toggle-orig:hover {
      opacity: 0.85;
    }
    
    .time { 
      font-size: 0.65rem; 
      opacity: 0.7; 
      text-align: right; 
      margin-top: 4px; 
    }

    .chat-input-container { 
      padding: 10px 15px; 
      border-top: 1px solid #eee; 
      display: flex; 
      gap: 8px; 
      background: #fff; 
    }
    
    .chat-input-container input { 
      flex: 1; 
      padding: 10px 15px; 
      border: 1px solid #ccc; 
      border-radius: 20px; 
      outline: none; 
      min-width: 0; 
    }
    
    .btn-send { 
      background: #d90429; 
      color: #fff; 
      border: none; 
      padding: 0 18px; 
      border-radius: 20px; 
      font-weight: bold; 
      cursor: pointer; 
      flex-shrink: 0; 
    }

    @media (max-width: 768px) {
      body { 
        height: 100vh; 
      }
      
      .chat-container { 
        flex-direction: column; 
      }
      
      .users-sidebar { 
        width: 100%; 
        height: 180px; 
        border-right: none; 
        border-bottom: 2px solid #ffd8df; 
      }
      
      .chat-window { 
        flex: 1; 
        height: calc(100vh - 240px); 
      }
      
      .message { 
        max-width: 90%; 
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="DASHBOARD.html" class="logo">❤️ LjubavNaPrviKlik</a>
    <div>
      <a href="DASHBOARD.html" class="btn-nav">🏠 Dashboard</a>
      <a href="KONTAKT.html" class="btn-nav">📩 Podrška</a>
    </div>
  </header>

  <div class="chat-container">
    <div class="users-sidebar">
      <div class="sidebar-header">
        <span>👥 Članovi (<span id="onlineCount">0</span> online)</span>
        <button class="btn-refresh" onclick="prisilnoOsvjezi()">🔄 Osvježi</button>
      </div>
      <div class="user-list" id="userList">
        <div style="padding:15px; text-align:center; color:#888;">Učitavanje...</div>
      </div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <div class="user-avatar" id="activeAvatar">💬</div>
        <div>
          <h3 id="chatWithTitle" style="font-size:1rem;">Odaberite člana</h3>
          <span id="chatUserStatusText" class="status-badge offline">ODABERITE ČLANA</span>
        </div>
      </div>

      <div class="ai-toolbar">
        <div>
          <span>🤖 <strong>AI Prevodilac</strong></span>
          <select id="aiTargetLang" style="padding:2px 5px; border-radius:4px; margin-left:6px;">
            <option value="Bosanski" selected>Bosanski / Hrvatski / Srpski</option>
            <option value="Engleski">Engleski</option>
            <option value="Nemački">Njemački</option>
          </select>
        </div>

        <div class="ai-toolbar-controls">
          <label style="cursor:pointer; font-weight:bold; display:flex; align-items:center; gap:4px;">
            <input type="checkbox" id="toggleAllOrig" onchange="toggleSveOriginale(this.checked)">
            👁️ Prikaži sve originale odjednom
          </label>
        </div>
      </div>

      <div class="messages-box" id="messagesBox">
        <div class="message received">
          Dobrodošli! Odaberite člana iz liste s lijeve strane za početak razgovora.
          <div class="time">Sada</div>
        </div>
      </div>

      <div class="chat-input-container">
        <input type="text" id="msgInput" placeholder="Napišite poruku..." onkeypress="if(event.key==='Enter') posaljiPoruku()">
        <button class="btn-send" onclick="posaljiPoruku()">Pošalji 🚀</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uduwpvdjmanrgpumdrfh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ';

    let _supabase = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let trenutniKorisnik = null;
    let primateljId = null;
    let primateljIme = '';
    let porukeBrojMap = {};
    let sviKorisniciBaza = [];

    async function ucitajSve() {
      if (!_supabase) return;
      
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        trenutniKorisnik = user;
        await postaviKorisnikaOnline();
      }

      await izracunajStatistikuPoruka();
      await ucitajListuKorisnika();
      slusajPorukeRealtime();
      slusajPromjeneStatusaRealtime();

      setInterval(async () => {
        if (trenutniKorisnik) await postaviKorisnikaOnline();
        await ucitajListuKorisnika();
      }, 120000);
    }

    async function prisilnoOsvjezi() {
      const btn = document.querySelector('.btn-refresh');
      if (btn) btn.innerText = "⏳ UCITAVAM...";

      await postaviKorisnikaOnline();
      await izracunajStatistikuPoruka();
      await ucitajListuKorisnika();
      
      if (primateljId) {
        await ucitajPorukeRazgovora();
      }

      setTimeout(() => {
        if (btn) btn.innerText = "🔄 Osvježi";
      }, 500);
    }

    async function postaviKorisnikaOnline() {
      if (!trenutniKorisnik) return;
      
      const mojId = String(trenutniKorisnik.id);
      const mojMail = trenutniKorisnik.email ? trenutniKorisnik.email.trim().toLowerCase() : '';

      try {
        let { data } = await _supabase
          .from('UPOZNAVANJ_KORISNICI')
          .update({ is_online: true, last_seen: new Date().toISOString() })
          .eq('USER', mojId)
          .select();

        if ((!data || data.length === 0) && mojMail) {
          const resultByMail = await _supabase
            .from('UPOZNAVANJ_KORISNICI')
            .update({ 
              is_online: true, 
              last_seen: new Date().toISOString(),
              USER: mojId 
            })
            .ilike('MAIL', mojMail)
            .select();

          if (!resultByMail.data || resultByMail.data.length === 0) {
            await _supabase
              .from('UPOZNAVANJ_KORISNICI')
              .insert([{
                USER: mojId,
                MAIL: mojMail,
                IME: mojMail.split('@')[0],
                is_online: true,
                last_seen: new Date().toISOString()
              }]);
          }
        }
      } catch (e) {
        console.warn("Greška pri postavljanju online statusa:", e);
      }
    }

    async function postaviKorisnikaOffline() {
      if (!trenutniKorisnik) return;
      
      const mojId = String(trenutniKorisnik.id);
      const mojMail = trenutniKorisnik.email ? trenutniKorisnik.email.trim().toLowerCase() : '';

      try {
        let { data } = await _supabase
          .from('UPOZNAVANJ_KORISNICI')
          .update({ is_online: false, last_seen: new Date().toISOString() })
          .eq('USER', mojId)
          .select();

        if ((!data || data.length === 0) && mojMail) {
          await _supabase
            .from('UPOZNAVANJ_KORISNICI')
            .update({ is_online: false, last_seen: new Date().toISOString() })
            .ilike('MAIL', mojMail);
        }
      } catch (e) {
        console.warn("Greška pri postavljanju offline statusa:", e);
      }
    }

    window.addEventListener('beforeunload', () => {
      postaviKorisnikaOffline();
    });

    async function izracunajStatistikuPoruka() {
      if (!trenutniKorisnik) return;
      
      try {
        const mojId = String(trenutniKorisnik.id);
        const { data: poruke } = await _supabase
          .from('PRIVATNE_PORUKE')
          .select('posiljalac, primalac')
          .or(`posiljalac.eq.${mojId},primalac.eq.${mojId}`);
          
        porukeBrojMap = {};
        if (poruke) {
          poruke.forEach(p => {
            const partner = String(p.posiljalac) === mojId ? String(p.primalac) : String(p.posiljalac);
            porukeBrojMap[partner] = (porukeBrojMap[partner] || 0) + 1;
          });
        }
      } catch (e) {}
    }

    async function ucitajListuKorisnika() {
      if (!_supabase) return;
      
      try {
        const { data: korisnici } = await _supabase
          .from('UPOZNAVANJ_KORISNICI')
          .select('*');
          
        sviKorisniciBaza = korisnici || [];
        osvjeziListuKorisnikaPrikaz();
      } catch (e) {}
    }

    function osvjeziListuKorisnikaPrikaz() {
      const listEl = document.getElementById('userList');
      if (!listEl) return;
      listEl.innerHTML = '';

      let lista = sviKorisniciBaza.filter(k => {
        const kId = String(k.USER || k.id || '');
        const kMail = k.MAIL || '';
        const mojMail = trenutniKorisnik ? trenutniKorisnik.email : '';
        const mojId = trenutniKorisnik ? String(trenutniKorisnik.id) : '';

        if (mojId && kId === mojId) return false;
        if (mojMail && kMail && kMail === mojMail) return false;
        return true;
      });

      if (lista.length === 0) {
        listEl.innerHTML = '<div style="padding:15px; text-align:center; color:#888;">Nema članova.</div>';
        return;
      }

      const sada = new Date().getTime();
      const provjeriAktivnost = (k) => {
        if (k.is_online !== true) return false;
        if (!k.last_seen) return true;
        const zadnjiPut = new Date(k.last_seen).getTime();
        return (sada - zadnjiPut) < 120000;
      };

      const onlineBroj = lista.filter(k => provjeriAktivnost(k)).length;
      document.getElementById('onlineCount').innerText = onlineBroj;

      lista.sort((a, b) => {
        const aOnline = provjeriAktivnost(a) ? 1 : 0;
        const bOnline = provjeriAktivnost(b) ? 1 : 0;
        if (aOnline !== bOnline) return bOnline - aOnline;

        const aId = String(a.USER || a.id || '');
        const bId = String(b.USER || b.id || '');
        return (porukeBrojMap[bId] || 0) - (porukeBrojMap[aId] || 0);
      });

      lista.forEach(k => {
        const uId = String(k.USER || k.id || '');
        const isOnline = provjeriAktivnost(k);
        const totalMsgs = porukeBrojMap[uId] || 0;

        const prikazIme = k.IME || k.MAIL || k.USERNAME || 'Član';
        const inicijal = prikazIme.charAt(0).toUpperCase() || 'C';

        const item = document.createElement('div');
        item.className = `user-item ${primateljId === uId ? 'active' : ''}`;
        item.onclick = () => odaberiKorisnikaZaChat(uId, prikazIme, isOnline);

        item.innerHTML = `
          <div class="user-avatar">${inicijal}</div>
          <div class="user-info">
            <h4>
              <span>${prikazIme}</span>
              ${totalMsgs > 0 ? `<span style="background:#d90429; color:#fff; font-size:0.65rem; padding:1px 5px; border-radius:8px;">💬 ${totalMsgs}</span>` : ''}
            </h4>
            <p>${isOnline ? '<span class="status-badge online">🟢 SADA ONLINE</span>' : '<span class="status-badge offline">⚪ NEAKTIVAN</span>'}</p>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function odaberiKorisnikaZaChat(userId, ime, isOnline) {
      primateljId = String(userId);
      primateljIme = ime;

      document.getElementById('chatWithTitle').innerText = ime;
      document.getElementById('activeAvatar').innerText = ime[0].toUpperCase();

      const statusBadge = document.getElementById('chatUserStatusText');
      statusBadge.className = isOnline ? 'status-badge online' : 'status-badge offline';
      statusBadge.innerText = isOnline ? '🟢 SADA ONLINE' : '⚪ NEAKTIVAN';

      osvjeziListuKorisnikaPrikaz();
      ucitajPorukeRazgovora();
    }

    async function ucitajPorukeRazgovora() {
      if (!trenutniKorisnik || !primateljId) return;
      
      const box = document.getElementById('messagesBox');
      box.innerHTML = '<div style="text-align:center; color:#888;">Učitavanje...</div>';

      try {
        const mojId = String(trenutniKorisnik.id);
        const pId = String(primateljId);
        
        const { data: poruke } = await _supabase
          .from('PRIVATNE_PORUKE')
          .select('*')
          .or(`and(posiljalac.eq.${mojId},primalac.eq.${pId}),and(posiljalac.eq.${pId},primalac.eq.${mojId})`)
          .order('created_at', { ascending: true });

        box.innerHTML = '';
        if (!poruke || poruke.length === 0) {
          box.innerHTML = `<div style="text-align:center; color:#888; margin-top:15px;">Započnite razgovor sa <strong>${primateljIme}</strong>!</div>`;
          return;
        }

        poruke.forEach(p => prikaziBublePoruku(p.id, p.poruka, p.poruka_prijevod, String(p.posiljalac) === mojId, p.created_at));
        box.scrollTop = box.scrollHeight;

        // Provjeri stanje glavnog prekidača za prikaz originala
        const toggleAll = document.getElementById('toggleAllOrig');
        if (toggleAll && toggleAll.checked) {
          toggleSveOriginale(true);
        }
      } catch (e) {
        box.innerHTML = '<div style="text-align:center; color:#888;">Nema poruka.</div>';
      }
    }

    function prikaziBublePoruku(msgId, tekst, prijevodTekst, jeMoja, vrijeme) {
      const box = document.getElementById('messagesBox');
      const msg = document.createElement('div');
      msg.className = `message ${jeMoja ? 'sent' : 'received'}`;
      
      const tFormat = vrijeme 
        ? new Date(vrijeme).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
        : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let primarniTekst = tekst;
      let sekundarniTekst = null;

      if (prijevodTekst && prijevodTekst.trim() !== "" && prijevodTekst !== tekst) {
        primarniTekst = prijevodTekst;
        sekundarniTekst = tekst;
      }

      let origHtml = '';
      if (sekundarniTekst) {
        origHtml = `
          <div>
            <button class="btn-toggle-orig" onclick="toggleOrig('${msgId}')">👁️ Prikaži/sakrij original</button>
            <div id="orig-${msgId}" class="translation-subtext">Original: ${sekundarniTekst}</div>
          </div>
        `;
      }

      msg.innerHTML = `<div>${primarniTekst}</div>${origHtml}<div class="time">${tFormat}</div>`;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    // Pojedinačno paljenje/gašenje
    function toggleOrig(id) {
      const el = document.getElementById(`orig-${id}`);
      if (el) {
        const trenutniStyle = window.getComputedStyle(el).display;
        if (trenutniStyle === 'none') {
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      }
    }

    // Prikaz svih originala odjednom preko prekidača u vrhu
    function toggleSveOriginale(prikaziSve) {
      const sviOriginali = document.querySelectorAll('.translation-subtext');
      sviOriginali.forEach(el => {
        el.style.display = prikaziSve ? 'block' : 'none';
      });
    }

    // Automatsko slanje i prevođenje
    async function posaljiPoruku() {
      const input = document.getElementById('msgInput');
      const tekst = input.value.trim();
      const ciljniJezik = document.getElementById('aiTargetLang').value;
      const btnSend = document.querySelector('.btn-send');
      
      if (!tekst || !primateljId) return;

      input.disabled = true;
      if (btnSend) btnSend.innerText = "⏳ Šaljem...";

      let automatskiPrijevod = null;

      try {
        const { data: aiData, error: aiError } = await _supabase.functions.invoke('prevedi-poruku', {
          body: { tekst: tekst, ciljniJezik: ciljniJezik }
        });

        if (!aiError && aiData && aiData.prijevod) {
          automatskiPrijevod = aiData.prijevod;
        }
      } catch (err) {
        console.error("Greška pri pozivanju AI servisa:", err);
      }

      const tempId = 'temp_' + Date.now();
      prikaziBublePoruku(tempId, tekst, automatskiPrijevod, true, new Date().toISOString());

      // Ako je uključen grupni prekidač, prikaži i novu poruku u originalu odmah
      const toggleAll = document.getElementById('toggleAllOrig');
      if (toggleAll && toggleAll.checked) {
        toggleSveOriginale(true);
      }

      input.value = '';
      input.disabled = false;
      input.focus();
      if (btnSend) btnSend.innerText = "Pošalji 🚀";

      porukeBrojMap[primateljId] = (porukeBrojMap[primateljId] || 0) + 1;
      osvjeziListuKorisnikaPrikaz();

      try {
        const mojId = trenutniKorisnik ? String(trenutniKorisnik.id) : 'gost';
        await _supabase
          .from('PRIVATNE_PORUKE')
          .insert([{ 
            posiljalac: mojId, 
            primalac: String(primateljId), 
            poruka: tekst,
            poruka_prijevod: automatskiPrijevod
          }]);
      } catch (e) {
        console.error("Greška pri upisu u bazu:", e);
      }
    }

    function slusajPorukeRealtime() {
      if (!_supabase) return;

      _supabase.channel('public:PRIVATNE_PORUKE')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'PRIVATNE_PORUKE' }, payload => {
          if (payload.new) {
            const mojId = trenutniKorisnik ? String(trenutniKorisnik.id) : '';
            const pos = String(payload.new.posiljalac);
            const prim = String(payload.new.primalac);

            const partner = (pos === mojId) ? prim : pos;

            porukeBrojMap[partner] = (porukeBrojMap[partner] || 0) + 1;
            osvjeziListuKorisnikaPrikaz();

            if (pos === String(primateljId)) {
              prikaziBublePoruku(payload.new.id, payload.new.poruka, payload.new.poruka_prijevod, false, payload.new.created_at);
              
              const toggleAll = document.getElementById('toggleAllOrig');
              if (toggleAll && toggleAll.checked) {
                toggleSveOriginale(true);
              }
            }
          }
        }).subscribe();
    }

    function slusajPromjeneStatusaRealtime() {
      if (!_supabase) return;
      
      _supabase.channel('public:UPOZNAVANJ_KORISNICI')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'UPOZNAVANJ_KORISNICI' }, () => {
          ucitajListuKorisnika();
        }).subscribe();
    }

    document.addEventListener('DOMContentLoaded', ucitajSve);
  </script>
</body>
</html>
