<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poruke | LjubavNaPrviKlik</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #fff0f3; color: #2b2d42; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background-color: #2b2d42; color: #fff; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.3rem; font-weight: bold; color: #fff; text-decoration: none; }
    .btn-nav { background: #d90429; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }

    .chat-container { flex: 1; display: flex; max-width: 1200px; width: 100%; margin: 10px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }

    .users-sidebar { width: 320px; background: #fdf0f2; border-right: 1px solid #ffd8df; display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px 15px; background: #2b2d42; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 10px 14px; border-bottom: 1px solid #ffe3e8; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .user-item:hover, .user-item.active { background: #ffe0e5; }
    
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #d90429; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .status-badge { font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: inline-block; }
    .status-badge.online { background: #28a745; color: #fff; }
    .status-badge.offline { background: #ccc; color: #444; }

    .user-info { flex: 1; }
    .user-info h4 { font-size: 0.9rem; margin-bottom: 2px; display: flex; justify-content: space-between; }

    .chat-window { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .chat-header { padding: 12px 20px; border-bottom: 1px solid #eee; background: #fafafa; display: flex; align-items: center; gap: 12px; }

    .ai-toolbar { background: #f3e5f5; border-bottom: 1px solid #e1bee7; padding: 6px 15px; font-size: 0.8rem; color: #4a148c; display: flex; justify-content: space-between; align-items: center; }

    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff8f9; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; word-wrap: break-word; }
    .message.sent { align-self: flex-end; background: #d90429; color: #fff; }
    .message.received { align-self: flex-start; background: #fff; color: #2b2d42; border: 1px solid #ddd; }
    .time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 4px; }

    .chat-input-container { padding: 10px 15px; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .chat-input-container input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .btn-send { background: #d90429; color: #fff; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-ai { background: #8e24aa; color: #fff; border: none; padding: 0 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <a href="DASHBOARD.html" class="logo">❤️ LjubavNaPrviKlik</a>
    <div>
      <a href="DASHBOARD.html" class="btn-nav">🏠 Dashboard</a>
      <a href="KONTAKT.html" class="btn-nav">📩 Podrška</a>
    </div>
  </header>

  <div class="chat-container">
    <div class="users-sidebar">
      <div class="sidebar-header">
        <span>👥 Članovi (<span id="onlineCount">0</span> online)</span>
        <button onclick="ucitajSve()" style="background:none; border:none; color:#fff; cursor:pointer;">🔄</button>
      </div>
      <div class="user-list" id="userList">
        <div style="padding:15px; text-align:center; color:#888;">Učitavanje...</div>
      </div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <div class="user-avatar" id="activeAvatar">💬</div>
        <div>
          <h3 id="chatWithTitle">Odaberite člana s lijeve strane</h3>
          <span id="chatUserStatusText" class="status-badge offline">ODABERITE ČLANA</span>
        </div>
      </div>

      <div class="ai-toolbar">
        <span>🤖 <strong>AI Prevodilac:</strong></span>
        <select id="aiTargetLang" style="padding:2px 5px; border-radius:4px;">
          <option value="Bosanski" selected>Bosanski / Hrvatski / Srpski</option>
          <option value="Engleski">Engleski</option>
          <option value="Nemački">Njemački</option>
        </select>
      </div>

      <div class="messages-box" id="messagesBox">
        <div class="message received">
          Dobrodošli! Odaberite člana iz liste s lijeve strane za početak razgovora.
          <div class="time">Sada</div>
        </div>
      </div>

      <div class="chat-input-container">
        <input type="text" id="msgInput" placeholder="Napišite poruku..." onkeypress="if(event.key==='Enter') posaljiPoruku()">
        <button class="btn-ai" onclick="prevediTekstPrijeSlanja()">🤖 Prevedi</button>
        <button class="btn-send" onclick="posaljiPoruku()">Pošalji 🚀</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uduwpvdjmanrgpumdrfh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ';

    let _supabase = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let trenutniKorisnik = null, primateljId = null, primateljIme = '';
    let onlineUserIds = new Set(), porukeBrojMap = {}, sviKorisniciBaza = [];

    async function ucitajSve() {
      if (!_supabase) return;
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) trenutniKorisnik = user;

      pratiOnlinePresence();
      await izracunajStatistikuPoruka();
      await ucitajListuKorisnika();
      slusajPorukeRealtime();
    }

    function pratiOnlinePresence() {
      if (!_supabase || !trenutniKorisnik) return;
      const room = _supabase.channel('online-users', { config: { presence: { key: trenutniKorisnik.id } } });
      room.on('presence', { event: 'sync' }, () => {
        onlineUserIds.clear();
        Object.keys(room.presenceState()).forEach(id => onlineUserIds.add(id));
        document.getElementById('onlineCount').innerText = onlineUserIds.size;
        osvjeziListuKorisnikaPrikaz();
      });
      room.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') await room.track({ online_at: new Date().toISOString() });
      });
    }

    async function izracunajStatistikuPoruka() {
      if (!trenutniKorisnik) return;
      try {
        const mojId = String(trenutniKorisnik.id);
        const { data: poruke } = await _supabase.from('PRIVATNE_PORUKE').select('posiljalac, primalac').or(`posiljalac.eq.${mojId},primalac.eq.${mojId}`);
        porukeBrojMap = {};
        if (poruke) {
          poruke.forEach(p => {
            const partner = String(p.posiljalac) === mojId ? String(p.primalac) : String(p.posiljalac);
            porukeBrojMap[partner] = (porukeBrojMap[partner] || 0) + 1;
          });
        }
      } catch (e) {}
    }

    async function ucitajListuKorisnika() {
      if (!_supabase) return;
      try {
        const { data: korisnici } = await _supabase.from('UPOZNAVANJ_KORISNICI').select('*');
        sviKorisniciBaza = korisnici || [];
        osvjeziListuKorisnikaPrikaz();
      } catch (e) {}
    }

    function osvjeziListuKorisnikaPrikaz() {
      const listEl = document.getElementById('userList');
      if (!listEl) return;
      listEl.innerHTML = '';

      let lista = sviKorisniciBaza.filter(k => {
        const kId = String(k.USER || k.id || '');
        return !trenutniKorisnik || kId !== String(trenutniKorisnik.id);
      });

      if (lista.length === 0) {
        listEl.innerHTML = '<div style="padding:15px; text-align:center; color:#888;">Nema pronađenih članova.</div>';
        return;
      }

      lista.sort((a, b) => {
        const aId = String(a.USER || a.id || '');
        const bId = String(b.USER || b.id || '');
        const aOnline = onlineUserIds.has(aId) ? 1 : 0;
        const bOnline = onlineUserIds.has(bId) ? 1 : 0;
        if (aOnline !== bOnline) return bOnline - aOnline;
        return (porukeBrojMap[bId] || 0) - (porukeBrojMap[aId] || 0);
      });

      lista.forEach(k => {
        const uId = String(k.USER || k.id || '');
        const isOnline = onlineUserIds.has(uId);
        const totalMsgs = porukeBrojMap[uId] || 0;

        const prikazIme = k.IME || k.MAIL || k.USERNAME || 'Član';
        const inicijal = prikazIme.charAt(0).toUpperCase() || 'C';

        const item = document.createElement('div');
        item.className = `user-item ${primateljId === uId ? 'active' : ''}`;
        item.onclick = () => odaberiKorisnikaZaChat(uId, prikazIme, isOnline);

        item.innerHTML = `
          <div class="user-avatar">${inicijal}</div>
          <div class="user-info">
            <h4>
              <span>${prikazIme}</span>
              ${totalMsgs > 0 ? `<span style="background:#d90429; color:#fff; font-size:0.65rem; padding:1px 5px; border-radius:8px;">💬 ${totalMsgs}</span>` : ''}
            </h4>
            <p>${isOnline ? '<span class="status-badge online">🟢 SADA ONLINE</span>' : '<span class="status-badge offline">⚪ NEAKTIVAN</span>'}</p>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function odaberiKorisnikaZaChat(userId, ime, isOnline) {
      primateljId = String(userId);
      primateljIme = ime;

      document.getElementById('chatWithTitle').innerText = `Dopisivanje sa: ${ime}`;
      document.getElementById('activeAvatar').innerText = ime[0].toUpperCase();

      const statusBadge = document.getElementById('chatUserStatusText');
      statusBadge.className = isOnline ? 'status-badge online' : 'status-badge offline';
      statusBadge.innerText = isOnline ? '🟢 SADA ONLINE' : '⚪ NEAKTIVAN';

      osvjeziListuKorisnikaPrikaz();
      ucitajPorukeRazgovora();
    }

    async function ucitajPorukeRazgovora() {
      if (!trenutniKorisnik || !primateljId) return;
      const box = document.getElementById('messagesBox');
      box.innerHTML = '<div style="text-align:center; color:#888;">Učitavanje...</div>';

      try {
        const mojId = String(trenutniKorisnik.id), pId = String(primateljId);
        const { data: poruke } = await _supabase.from('PRIVATNE_PORUKE').select('*')
          .or(`and(posiljalac.eq.${mojId},primalac.eq.${pId}),and(posiljalac.eq.${pId},primalac.eq.${mojId})`)
          .order('created_at', { ascending: true });

        box.innerHTML = '';
        if (!poruke || poruke.length === 0) {
          box.innerHTML = `<div style="text-align:center; color:#888; margin-top:15px;">Započnite razgovor sa <strong>${primateljIme}</strong>!</div>`;
          return;
        }

        poruke.forEach(p => prikaziBublePoruku(p.poruka, String(p.posiljalac) === mojId, p.created_at));
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        box.innerHTML = '<div style="text-align:center; color:#888;">Nema poruka.</div>';
      }
    }

    function prikaziBublePoruku(tekst, jeMoja, vrijeme) {
      const box = document.getElementById('messagesBox');
      const msg = document.createElement('div');
      msg.className = `message ${jeMoja ? 'sent' : 'received'}`;
      const tFormat = vrijeme ? new Date(vrijeme).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      msg.innerHTML = `<div>${tekst}</div><div class="time">${tFormat}</div>`;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    async function posaljiPoruku() {
      const input = document.getElementById('msgInput');
      const tekst = input.value.trim();
      if (!tekst || !primateljId) return;

      prikaziBublePoruku(tekst, true, new Date().toISOString());
      input.value = '';

      porukeBrojMap[primateljId] = (porukeBrojMap[primateljId] || 0) + 1;
      osvjeziListuKorisnikaPrikaz();

      try {
        const mojId = trenutniKorisnik ? String(trenutniKorisnik.id) : 'gost';
        await _supabase.from('PRIVATNE_PORUKE').insert([{ posiljalac: mojId, primalac: String(primateljId), poruka: tekst }]);
      } catch (e) {}
    }

    function prevediTekstPrijeSlanja() {
      const input = document.getElementById('msgInput');
      if (input.value.trim()) input.value = `[${document.getElementById('aiTargetLang').value}] ${input.value.trim()}`;
    }

    function slusajPorukeRealtime() {
      if (!_supabase) return;
      _supabase.channel('public:PRIVATNE_PORUKE')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'PRIVATNE_PORUKE' }, payload => {
          if (payload.new) {
            const mojId = trenutniKorisnik ? String(trenutniKorisnik.id) : '';
            const pos = String(payload.new.posiljalac), prim = String(payload.new.primalac);
            const partner = pos === mojId ? prim : pos;
            porukeBrojMap[partner] = (porukeBrojMap[partner] || 0) + 1;
            osvjeziListuKorisnikaPrikaz();
            if (pos === String(primateljId)) prikaziBublePoruku(payload.new.poruka, false, payload.new.created_at);
          }
        }).subscribe();
    }

    document.addEventListener('DOMContentLoaded', ucitajSve);
  </script>
</body>
</html>
